<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="neon-cyan" x1="12" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00F2FE"/>
      <stop offset="1" stop-color="#4FACFE"/>
    </linearGradient>
    <linearGradient id="glow-grad" x1="32" y1="16" x2="32" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00F2FE" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4FACFE" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="64" height="64" rx="16" fill="url(#bg-grad)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#neon-cyan)" stroke-width="1.5" stroke-opacity="0.4"/>
  <circle cx="32" cy="32" r="22" fill="url(#glow-grad)"/>

  <!-- Futuristic Downloader 5K Layers & Arrow Symbol -->
  <g filter="url(#glow-filter)">
    <!-- Top layer chevron -->
    <path d="M32 10L14 19L32 28L50 19L32 10Z" fill="url(#neon-cyan)" fill-opacity="0.25" stroke="url(#neon-cyan)" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Middle chevron -->
    <path d="M14 27L32 36L50 27" stroke="url(#neon-cyan)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Bottom container tray -->
    <path d="M14 36L32 45L50 36" stroke="url(#neon-cyan)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Central Download arrow indicator -->
    <path d="M32 21V39M32 39L25 32M32 39L39 32" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Bottom base dot -->
    <circle cx="32" cy="51" r="2" fill="#00F2FE"/>
  </g>
</svg>
